name: Shared core regression (not full GUI validation)
on:
  push:
    branches: [master, windows, mac, ubuntu]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  shared-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests -B build/shared-tests -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/shared-tests --config Release
      - run: ctest --test-dir build/shared-tests -C Release --output-on-failure
